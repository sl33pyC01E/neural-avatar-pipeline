plugins { id 'com.android.application' }

android {
    namespace 'ai.cleo.ardyavatarvalidation'
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'ai.cleo.ardyavatarvalidation'
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName '0.5.2-qwen-prebuilt'
        ndk { abiFilters.addAll((project.findProperty('targetAbis') ?: 'arm64-v8a').split(',')) }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/avatarAssets')
    buildTypes { release { proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/selectedRuntimeAssets')
    sourceSets.main.assets.srcDir '../../recovery/assets'
    sourceSets.main.jniLibs.srcDir '../../recovery/lib'
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/chatNative')
    androidResources { noCompress += ['vrm', 'onnx', 'gguf', 'f32', 'i32', 'npy'] }
    // Sherpa's legacy x86 slice dynamically links another ORT; supported slices are static.
    packaging { jniLibs { useLegacyPackaging = true; excludes += ['lib/x86/**', 'lib/armeabi-v7a/**']; keepDebugSymbols += ['**/libcleo_*.so'] } }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.1'
    implementation files('../../payloads/dependencies/sherpa-onnx-static-link-onnxruntime-1.13.8.aar')
}

tasks.register('checkAvatarPayload') {
    doLast {
        if (!layout.buildDirectory.file('generated/avatarAssets/provenance.json').get().asFile.exists()) {
            throw new GradleException('Run tools/prepare_avatar_validation.py before building.')
        }
        if (!layout.buildDirectory.file('generated/runtimeAssets/pocket-tts/manifest.json').get().asFile.exists()) {
            throw new GradleException('Run tools/prepare_runtime_assets.py before building.');
        }
        if (!layout.buildDirectory.file('generated/runtimeAssets/lam/manifest.json').get().asFile.exists()) {
            throw new GradleException('Export LAM and run tools/prepare_runtime_assets.py before building.');
        }
    }
}
tasks.register('stageRuntimePayload', Sync) {
    from(layout.buildDirectory.dir('generated/runtimeAssets')) {
        include 'pocket-tts/**', 'import-models.json'
        include 'lam/**'
    }
    into layout.buildDirectory.dir('generated/selectedRuntimeAssets')
}
tasks.register('stageChatNative', Sync) {
    from('../../payloads/benchmark') {
        include 'llama-server', 'llama-server-opencl', 'whisper-server', 'libcleo_whisperx.so'
        rename { name -> ['llama-server':'libcleo_llama.so','llama-server-opencl':'libcleo_llama_opencl.so','whisper-server':'libcleo_whisper.so'].get(name,name) }
    }
    into layout.buildDirectory.dir('generated/chatNative/arm64-v8a')
    doFirst {
        ['llama-server','llama-server-opencl','whisper-server','libcleo_whisperx.so'].each { name ->
            if (!file('../../payloads/benchmark/' + name).isFile()) throw new GradleException('Build the Android model runtimes first: ' + name)
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkAvatarPayload', 'stageRuntimePayload', 'stageChatNative' }
